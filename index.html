<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}

button:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}button:disabled{opacity:.35;cursor:default}

.pn{font-size:14px;min-width:78px;text-align:center;font-variant-numeric:tabular-nums}

let cur=1,spread=false;
try{const m=/^#p(\\d+)$/.exec(location.hash);if(m)cur=Math.min(N,Math.max(1,+m[1]))}catch(e){}
sl.max=N;
function step(){return spread?2:1}
var show=function(){
  if(spread&&cur>1&&cur%2==1)cur--;
  a.src=P[cur-1];a.alt="หน้า "+cur;
  if(spread&&cur>1&&cur<N){b.src=P[cur];b.alt="หน้า "+(cur+1);b.hidden=false;pn.textContent=cur+"–"+(cur+1)+" / "+N}
  else{b.hidden=true;pn.textContent=cur+" / "+N}
  sl.value=cur;pv.disabled=cur<=1;nx.disabled=cur+(b.hidden?1:2)>N;
  try{history.replaceState(null,"","#p"+cur)}catch(e){}
  v.scrollTo(0,0);
}
function go(n){cur=Math.min(N,Math.max(1,n));show()}
pv.onclick=()=>go(cur-(spread&&cur>2?2:1));
nx.onclick=()=>go(cur+(b.hidden?1:2));
sl.oninput=()=>go(+sl.value);
md.onclick=()=>{spread=!spread;md.textContent=spread?"หน้าเดี่ยว":"หน้าคู่";show()};
zm.onclick=()=>{v.classList.toggle("zoom");zm.textContent=v.classList.contains("zoom")?"พอดีจอ":"ซูม"};
addEventListener("keydown",e=>{if(e.key=="ArrowRight"||e.key=="PageDown")nx.click();if(e.key=="ArrowLeft"||e.key=="PageUp")pv.click();if(e.key=="Home")go(1);if(e.key=="End")go(N)});
let sx=null;v.addEventListener("touchstart",e=>{sx=e.touches.length==1&&!v.classList.contains("zoom")?e.touches[0].clientX:null},{passive:true});
v.addEventListener("touchend",e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)(d<0?nx:pv).click();sx=null});
const pre=new Image();const _s=show;show=function(){_s();for(const k of [cur+1,cur+2,cur-1]){if(k>=1&&k<=N)new Image().src=P[k-1]}};show();
